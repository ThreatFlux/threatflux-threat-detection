name: Auto Release

concurrency:
  # A dry run gets its own group, so a rehearsal can never cancel a real release.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

# workflow_run only fires for completed CI and Security runs on main. The
# reusable workflow releases only when that run succeeded and came from this
# repository, and only after CI and Security both passed for the commit, so a
# fork or pull request cannot drive a release.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- gated on a successful same-repository run, see above
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    # The reusable workflow requests these for its release job; its check job
    # only reads actions and contents.
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The automation App pushes the release commit and annotated tag, so the
      # tag push starts release.yml by itself and the reusable workflow skips
      # these dispatches. They only run on the GITHUB_TOKEN path (no App
      # configured), where the tag push starts nothing.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
