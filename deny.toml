# cargo-deny configuration for ThreatFlux Threat Detection
# This file controls dependency license and security checking

[advisories]
ignore = [
    "RUSTSEC-2023-0071", # RSA timing attack - in yara-x dependency
    "RUSTSEC-2025-0141", # bincode is unmaintained - in yara-x dependency
    # wasmtime cross-engine Store type-index confusion. Transitive through
    # yara-x 1.21, which requires wasmtime ^45.0.3; the advisory has no patched
    # 45.x release. yara-x owns its single Engine/Store pair internally and we
    # never hand it Stores from another engine, so the issue is unreachable
    # here. Drop this entry once yara-x moves to wasmtime >= 46.0.2.
    "RUSTSEC-2026-0222",
    # Further wasmtime advisories with no patched 45.x release, reached only
    # through yara-x 1.21 (wasmtime ^45.0.3). yara-x enables only the cranelift
    # and runtime features, so the affected wasmtime-wasi filesystem code and
    # component-model code are not compiled in. See .cargo/audit.toml.
    "RUSTSEC-2026-0269", # wasmtime-wasi filesystem sandbox escape
    "RUSTSEC-2026-0316", # component-model Val lifting skips the fuel limit
    "RUSTSEC-2026-0327", # component-model-async callback result count
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    { name = "openssl", version = "<0.10.45" },
    { name = "openssl-sys", version = "<0.9.75" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
